---
# =============================================================================
# USER MANAGEMENT VARIABLES
# =============================================================================

# Groups to create BEFORE users are created (order matters for group assignment)
user_groups:
  - developers
  - devops
  - qa
  - managers
  - readonly

# 20 Linux user accounts
# Passwords are hashed using SHA-512 — never store plaintext in production.
# In production, replace inline hashes with Ansible Vault encrypted strings.
