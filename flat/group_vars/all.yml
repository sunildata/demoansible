# =============================================================================
# APPLICATION VARIABLES (RedHat Family)
# =============================================================================
# Notes:
#   - htop       : requires EPEL repository (installed as pre-task in apps.yml)
#   - vim-enhanced: full Vim on RedHat; 'vim' alone installs only vim-minimal
#   - nginx      : available in AppStream (RHEL 8+) or EPEL (RHEL 7)
# service: ~ means no daemon to manage (git, curl, htop, vim are CLI tools)
applications:
  - name: nginx
    package: nginx
    service: nginx
    service_state: started
    service_enabled: true

  - name: git
    package: git
    service: ~
    service_state: ~
    service_enabled: ~

  - name: curl
    package: curl
    service: ~
    service_state: ~
    service_enabled: ~

  - name: htop
    package: htop
    service: ~
    service_state: ~
    service_enabled: ~

  - name: vim-enhanced
    package: vim-enhanced
    service: ~
    service_state: ~
    service_enabled: ~
