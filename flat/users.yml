---
# =============================================================================
# FLAT APPROACH — File 1: User Management
# =============================================================================
# Target OS : Amazon Linux 2023 (also works on RHEL / CentOS / Rocky / Fedora)
# Creates   : 20 Linux users across 5 groups
#
# Run against managed nodes only:
#   ansible-playbook flat/users.yml -i flat/inventory/hosts -l managed
#
# Run against all servers (master + host1 + host2):
#   ansible-playbook flat/users.yml -i flat/inventory/hosts -l all_servers
#
# Dry run:
#   ansible-playbook flat/users.yml -i flat/inventory/hosts -l managed --check
# =============================================================================

- name: "User Management — Create users, set passwords and groups"
  hosts: all
  become: true
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: "Pre-flight — Verify OS is RedHat family (includes Amazon Linux)"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >
          Unsupported OS: {{ ansible_os_family }}.
          Supported: Amazon Linux 2023, RHEL, CentOS, Rocky, AlmaLinux, Fedora.
        success_msg: "OS '{{ ansible_distribution }} {{ ansible_distribution_version }}' — OK"
      tags: [always, preflight]

  tasks:
    - name: "Ensure groups exist before users are created"
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ user_groups }}"
      tags: [users, groups]

    - name: "Create user account — {{ item.name }}"
      ansible.builtin.user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        group: "{{ item.primary_group }}"
        groups: "{{ item.groups }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        state: "{{ item.state | default('present') }}"
        create_home: true
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [users, user_create]
