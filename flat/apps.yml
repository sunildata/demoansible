---
# =============================================================================
# FLAT APPROACH — File 2: Application Installation (RedHat Family)
# =============================================================================
# Target OS: RHEL / CentOS / Rocky Linux / AlmaLinux / Fedora
# Installs: nginx, git, curl, htop, vim-enhanced
# Manages:  nginx service (start + enable at boot), firewalld HTTP rule
#
# Prerequisites:
#   - EPEL repository is installed by this playbook automatically
#
# Run:     ansible-playbook flat/apps.yml -i flat/inventory/hosts
# Dry run: ansible-playbook flat/apps.yml -i flat/inventory/hosts --check
# =============================================================================

- name: "Application Installation — Install and start 5 applications"
  hosts: all
  become: true
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: "Pre-flight — Verify OS is RedHat family"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >
          Unsupported OS: {{ ansible_os_family }}.
          This playbook targets RedHat family (RHEL, CentOS, Rocky, AlmaLinux, Fedora).
        success_msg: "OS '{{ ansible_distribution }} {{ ansible_distribution_version }}' is supported"
      tags: [always, preflight]

    - name: "Pre-flight — Install EPEL repository (required for htop)"
      ansible.builtin.package:
        name: epel-release
        state: present
      tags: [always, preflight]

    - name: "Pre-flight — Refresh dnf/yum package cache"
      ansible.builtin.command:
        cmd: "{{ 'dnf' if ansible_pkg_mgr == 'dnf' else 'yum' }} makecache"
      changed_when: false
      tags: [always, preflight]

  tasks:
    - name: "Install application packages"
      ansible.builtin.package:
        name: "{{ item.package }}"
        state: present
      loop: "{{ applications }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [apps, packages]

    - name: "Start and enable service — {{ item.name }}"
      ansible.builtin.service:
        name: "{{ item.service }}"
        state: "{{ item.service_state }}"
        enabled: "{{ item.service_enabled }}"
      loop: "{{ applications }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.service is not none
      tags: [apps, services]

    - name: "Firewalld — allow HTTP traffic for nginx"
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-service=http
      register: fw_http
      changed_when: "'already enabled' not in fw_http.stderr | default('')"
      failed_when:
        - fw_http.rc != 0
        - "'already enabled' not in fw_http.stderr | default('')"
      tags: [apps, firewall]

    - name: "Firewalld — reload to apply new rules"
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: true
      when: fw_http is changed
      tags: [apps, firewall]
