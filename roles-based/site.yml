---
# =============================================================================
# ROLES-BASED APPROACH — Orchestration Playbook
# =============================================================================
# Target OS  : Amazon Linux 2023 on AWS EC2
# Servers    : master (172.31.42.76) | host1 (172.31.38.10) | host2 (172.31.32.228)
# SSH User   : ec2-user
#
# Prerequisites on master:
#   pip3 install passlib          (for password_hash filter)
#   chmod 400 ~/.ssh/your-key.pem (replace with your actual key filename)
#
# Run against managed nodes (host1 + host2) only:
#   ansible-playbook roles-based/site.yml -i roles-based/inventory/hosts -l managed
#
# Run against all 3 servers (master + host1 + host2):
#   ansible-playbook roles-based/site.yml -i roles-based/inventory/hosts -l all_servers
#
# Dry run (no changes applied):
#   ansible-playbook roles-based/site.yml -i roles-based/inventory/hosts -l managed --check
#
# Compare this 8-line play body with flat/users.yml + flat/apps.yml to see the difference.
# =============================================================================

- name: "Provision EC2 servers — users, groups, and applications"
  hosts: all
  become: true

  roles:
    - role: common      # Step 1: Pre-flight + EPEL (RHEL only) + dnf cache + OS groups
    - role: users       # Step 2: 20 Linux users with hashed passwords + group memberships
    - role: apps        # Step 3: Install 5 packages + start nginx + firewalld (if active)
