---
# =============================================================================
# Role: apps — Handlers (RedHat Family)
# =============================================================================

- name: "Verify installed packages"
  ansible.builtin.debug:
    msg: "Package installation complete. Run 'which nginx git curl htop vim' to verify."
  listen: "Verify installed packages"

- name: "Reload firewalld"
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  listen: "Reload firewalld"
