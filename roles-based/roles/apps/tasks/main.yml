---
# =============================================================================
# Role: apps
# Purpose : Install 5 applications, manage service state, and optionally
#           configure firewalld (skipped automatically on EC2).
# Target  : Amazon Linux 2023 (also works on RHEL / CentOS / Rocky / Fedora)
#
# EC2 Note: AWS Security Groups control inbound traffic on EC2 — firewalld
#           is typically not running. Open port 80/443 in your Security Group.
#           The firewalld tasks below are skipped automatically when firewalld
#           is not active.
#
# Variables consumed (from group_vars/all.yml):
#   - applications : list of app definitions
# =============================================================================

- name: "Install application packages"
  ansible.builtin.package:
    name: "{{ item.package }}"
    state: "{{ apps_package_state }}"
  loop: "{{ applications }}"
  loop_control:
    label: "{{ item.name }}"
  notify: "Verify installed packages"
  tags: [apps, packages]

- name: "Start and enable service — {{ item.name }}"
  ansible.builtin.service:
    name: "{{ item.service }}"
    state: "{{ item.service_state }}"
    enabled: "{{ item.service_enabled }}"
  loop: "{{ applications }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.service is not none
  tags: [apps, services]

# Detect whether firewalld is running before attempting to configure it.
# On EC2, firewalld is typically inactive — tasks below will be skipped.
- name: "Gather service facts (to detect if firewalld is active)"
  ansible.builtin.service_facts:
  tags: [apps, firewall]

- name: "Firewalld — allow HTTP traffic for nginx (only if firewalld is running)"
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-service=http
  register: fw_http
  changed_when: "'already enabled' not in fw_http.stderr | default('')"
  failed_when:
    - fw_http.rc != 0
    - "'already enabled' not in fw_http.stderr | default('')"
  notify: "Reload firewalld"
  when:
    - ansible_facts.services is defined
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
  tags: [apps, firewall]

- name: "Firewalld — allow HTTPS traffic for nginx (only if firewalld is running)"
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-service=https
  register: fw_https
  changed_when: "'already enabled' not in fw_https.stderr | default('')"
  failed_when:
    - fw_https.rc != 0
    - "'already enabled' not in fw_https.stderr | default('')"
  notify: "Reload firewalld"
  when:
    - ansible_facts.services is defined
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
  tags: [apps, firewall]
