galaxy_info:
  role_name: common
  author: devops-team
  description: >
    OS baseline role for RedHat family — pre-flight OS checks, EPEL repository
    installation, dnf/yum cache refresh, and OS group creation.
    Must be applied before the users and apps roles.
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: EL
      versions: ["7", "8", "9"]
    - name: Fedora
      versions: ["37", "38", "39", "40"]

dependencies: []
