---
# =============================================================================
# Role: common (RedHat Family)
# Purpose: OS baseline — pre-flight checks, EPEL setup, dnf cache, group creation.
#          Must run BEFORE the users and apps roles.
# Target OS: RHEL / CentOS / Rocky Linux / AlmaLinux / Fedora
# =============================================================================

- name: "Pre-flight — Verify OS is RedHat family"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
    fail_msg: >
      Unsupported OS: {{ ansible_os_family }}.
      This role targets RedHat family (RHEL, CentOS, Rocky, AlmaLinux, Fedora).
    success_msg: "OS '{{ ansible_distribution }} {{ ansible_distribution_version }}' is supported"
  tags: [always, common, preflight]

- name: "Pre-flight — Install EPEL repository (required for htop and other packages)"
  ansible.builtin.package:
    name: epel-release
    state: present
  tags: [always, common, preflight]

- name: "Pre-flight — Refresh dnf/yum package cache"
  ansible.builtin.command:
    cmd: "{{ 'dnf' if ansible_pkg_mgr == 'dnf' else 'yum' }} makecache"
  changed_when: false
  tags: [always, common, preflight]

- name: "Ensure OS groups exist"
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ user_groups }}"
  tags: [common, groups]
